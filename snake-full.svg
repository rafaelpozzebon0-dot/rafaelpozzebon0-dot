
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 676 96"
     width="100%" role="img">

  <defs>
    <pattern id="grid" width="13" height="13"
             patternUnits="userSpaceOnUse">
      <rect x="1.5" y="1.5" width="10" height="10"
            rx="2" fill="#0e4429"/>
    </pattern>

    <path id="route"
      d="M5 5 H668 V18 H5 V31 H668 V44 H5 V57 H668 V70 H5 V83 H668"/>
  </defs>

  <rect width="676" height="96" fill="url(#grid)"/>

  <g fill="#238636">
    <circle r="5">
      <animateMotion dur="45s" repeatCount="indefinite">
        <mpath href="#route"/>
      </animateMotion>
    </circle>
  </g>

  <g fill="#8957e5">
    <circle r="4.5">
      <animateMotion dur="45s" begin="-0.55s"
                     repeatCount="indefinite">
        <mpath href="#route"/>
      </animateMotion>
    </circle>
    <circle r="4.5">
      <animateMotion dur="45s" begin="-1.1s"
                     repeatCount="indefinite">
        <mpath href="#route"/>
      </animateMotion>
    </circle>
    <circle r="4.5">
      <animateMotion dur="45s" begin="-1.65s"
                     repeatCount="indefinite">
        <mpath href="#route"/>
      </animateMotion>
    </circle>
    <circle r="4.5">
      <animateMotion dur="45s" begin="-2.2s"
                     repeatCount="indefinite">
        <mpath href="#route"/>
      </animateMotion>
    </circle>
    <circle r="4.5">
      <animateMotion dur="45s" begin="-2.75s"
                     repeatCount="indefinite">
        <mpath href="#route"/>
      </animateMotion>
    </circle>
  </g>
</svg>
