
name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: rafaelpozzebon0-dot
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.svg?palette=github

      - name: Remove progress bar
        run: |
          sudo python3 - <<'PY'
          import re
          from pathlib import Path

          for filename in ["github-snake.svg", "github-snake-dark.svg"]:
              path = Path("dist") / filename
              content = path.read_text()
              content = re.sub(r'<rect class="u u0"[^>]*/>', '', content)
              path.write_text(content)
          PY

      - name: Publish generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
